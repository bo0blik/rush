name: Web demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot 4.7.2 and Web template
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          python3 tools/install_web_template.py 4.7.2
      - name: Import project and check gameplay
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import
          Godot_v4.7.2-stable_linux.x86_64 --headless --script tests/motorcycle_physics_smoke.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --script tests/demo_smoke.gd
      - name: Export Web release
        run: |
          mkdir -p build/web
          Godot_v4.7.2-stable_linux.x86_64 --headless --export-release Web "$PWD/build/web/index.html"
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
